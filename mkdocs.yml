# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current; a setting here
# wins over the same one there. Preview the website while you write, at
# http://127.0.0.1:8000, with the tools of the Docs workflow in .venv-docs:
#   python3 -m venv .venv-docs
#   .venv-docs/bin/pip install --require-hashes -r .github/docs-requirements.txt
#   .venv-docs/bin/mkdocs serve
# On Windows, with py -3 for python3 and .venv-docs/Scripts/ for .venv-docs/bin/.
# https://squidfunk.github.io/mkdocs-material/
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Dennis Otto"
site_description: "The projects of Dennis Otto in one place: Home Assistant, Nextcloud and Paperless, GitHub automation and the blueprint they all share."
# The website of the owner itself lives at the root of its address.
site_url: https://dennis-otto.github.io/
# The header leads to the owner's profile with every project, not to the repository
# of this website; the pencil of a page still opens it in that repository.
repo_url: https://github.com/Dennis-Otto
repo_name: Dennis-Otto
edit_uri: https://github.com/Dennis-Otto/dennis-otto.github.io/edit/main/docs/
copyright: "© 2026 Dennis Otto"

# Templates of this website on top of those of the theme: overrides/home.html, the
# home page with its hero, and overrides/404.html, the page of every address at
# dennis-otto.github.io that leads nowhere, with the projects of projects.toml. The
# monogram of docs/assets/logo.svg is the logo in the header and the icon of the
# browser tab; scripts/icons.sh makes favicon.ico and apple-touch-icon.png from it
# for the root of the address. The rest of the theme comes from the blueprint.
theme:
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg

# A website in more than one language: the pages of another language sit next to
# their English ones, such as index.de.md beside index.md, and a switch in the header
# changes between them.
plugins:
  search:
    lang: [en, de]
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        site_description: "Die Projekte von Dennis Otto an einem Ort: Home Assistant, Nextcloud und Paperless, Automatisierung auf GitHub und der Blueprint, den sie alle teilen."
        nav_translations:
          Home: Startseite
          Releases: Neuigkeiten
          Trust: Vertrauen
          Projects: Projekte
          This website: Diese Website
          About: Über
          Dennis Otto: Dennis Otto

extra_css:
  - stylesheets/extra.css

# The .license files beside the pictures of the projects name their licenses for
# REUSE, and scripts/screenshots.sh takes the pictures of the website that the
# READMEs alone show, website-*; the website leaves them out, but not the pictures of the
# search, search-*, which the About pages show. It leaves out the scripts of
# overrides/partials/ too, which the templates include inline and MkDocs would copy
# as files of the theme.
exclude_docs: |
  *.license
  /images/website-*.png
  /images/website-*.webp
  /partials/*.js

# The links in the footer of every page.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Dennis-Otto
      name: GitHub
    - icon: octicons/heart-16
      link: https://github.com/sponsors/Dennis-Otto
      name: GitHub Sponsors

# The menu: a tab in the header for each entry at the top, and beside the pages of a
# section the menu of its pages. Home has the Releases page with the notes of the
# latest releases of every project, Trust the guarantees of every project and the
# security and privacy of this website, About who builds the projects and how, and
# the automation of this repository, which the blueprint writes; it would add that
# page as a tab of its own if the menu didn't name it. The decision records are on
# the website too, linked from the About page and the security page.
nav:
  - Home:
      - index.md
      - Releases: releases.md
  - Trust:
      - Projects: trust.md
      - This website: security.md
  - About:
      - Dennis Otto: about.md
      - automation.md

# The hooks of every website, and those of this one in .github/mkdocs_project.py: the
# cards of the projects of projects.toml, robots.txt and security.txt for the whole
# address, the structured data of the home page, and the checks of the translations.
# This list replaces that of .github/mkdocs-blueprint.yml, so it names both files.
hooks:
  - .github/mkdocs_blueprint.py
  - .github/mkdocs_project.py
