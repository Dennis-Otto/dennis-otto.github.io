# The projects of the website, written once. The home page shows a card for each,
# in every language of the website, and the table of README.md lists them all with
# every address, so that the link check of the Markdown checks those too.
# .github/mkdocs_project.py reads this file: while MkDocs builds the website, it puts
# the cards in place of the line <!-- projects --> of docs/index.md and
# docs/index.de.md, and
#   python3 -I .github/mkdocs_project.py --write
# writes the table of the README, which `bash scripts/check.sh` checks. The same list
# makes the 404 page of the address, the sitemaps of robots.txt and the structured
# data of the home page, which tells search engines about every project.
#
# The keys of every [[project]], in the order of the cards on the page:
#   slug     the anchor of its card, such as /#ha-autodarts, the same in every language
#   repo     its repository on GitHub, for the table of the README; the dashboard has none
#   license  the SPDX identifier of the license of its repository, such as MIT
#   platform what it runs on or with, such as Home Assistant
#            (license and platform go with repo, for the structured data)
#   icon     the icon before its name
#   name     the heading of its card
#   tagline  one line about it, for the table of the README and other short lists
#   summary  the text of its card
#   start    the first button of its card: where a reader starts, such as the
#            installation, with its icon, its label and its address
#   docs     the address of its documentation, the second button (optional); one at
#            dennis-otto.github.io puts the sitemap of the project into robots.txt
#
# Every text has one entry per language, such as name.en and name.de. An address,
# such as start.url or docs, is the same in every language, or has one per language
# too; a language without an address of its own takes that of the first. Icons are
# those of Material for MkDocs, such as material-download:
# https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/

# The languages of the website; the README is in the first.
languages = ["en", "de"]

# The second button of every card with documentation.
[documentation]
icon = "material-book-open-variant"
label.en = "Documentation"
label.de = "Dokumentation"

[[project]]
slug = "ha-autodarts"
repo = "Dennis-Otto/ha-autodarts"
license = "MIT"
platform = "Home Assistant"
icon = "material-bullseye-arrow"
name.en = "Autodarts for Home Assistant"
name.de = "Autodarts für Home Assistant"
tagline.en = "Autodarts for Home Assistant, local and in realtime"
tagline.de = "Autodarts für Home Assistant, lokal und in Echtzeit"
summary.en = "Local realtime control of an Autodarts board in Home Assistant: X01, Cricket, party and training games, tournaments and a bot, statistics with heatmaps, dashboard cards and blueprints, games started by voice. No cloud account needed."
summary.de = "Ein Autodarts-Board lokal und in Echtzeit aus Home Assistant steuern: X01, Cricket, Party- und Trainingsspiele, Turniere und ein Bot, Statistiken mit Heatmaps, Dashboard-Karten und Blueprints, Spiele per Sprache starten. Ganz ohne Cloud-Konto."
start.icon = "material-download"
start.label.en = "Install with HACS"
start.label.de = "Mit HACS installieren"
start.url = "https://my.home-assistant.io/redirect/hacs_repository/?owner=Dennis-Otto&repository=ha-autodarts&category=integration"
docs.en = "https://dennis-otto.github.io/ha-autodarts/"
docs.de = "https://dennis-otto.github.io/ha-autodarts/de/"

