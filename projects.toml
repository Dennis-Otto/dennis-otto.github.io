# The projects of the website, written once. The home page shows them in groups, a
# card with a picture for each, in every language of the website, and the table of
# README.md lists them all with every address, so that the link check of the
# Markdown checks those too. .github/mkdocs_project.py reads this file: while MkDocs
# builds the website, it puts the groups with their cards in place of the line
# <!-- projects --> of docs/index.md and docs/index.de.md, and
#   python3 -I .github/mkdocs_project.py --write
# writes the table of the README, which `bash scripts/check.sh` checks. The same list
# makes the 404 page of the address, the sitemaps of robots.txt, the structured data
# of the home page, which tells search engines about every project, and the search
# of the website, which finds the documentation of every project.
#
# The keys of every [[group]], in the order of the groups on the page:
#   id       the anchor of its heading, such as /#maintainers, the same in every
#            language
#   heading  the heading of the group, above its cards
#   note     a sentence below its cards, in Markdown, such as one that explains how
#            two of its projects work together (optional)
#
# The keys of every [[project]], in the order of the cards on the page:
#   slug     the anchor of its card, such as /#homedarts-for-autodarts, the same in
#            every language
#   repo     its repository on GitHub, for the table of the README; the dashboard has none
#   license  the SPDX identifier of the license of its repository, such as MIT
#   platform what it runs on or with, such as Home Assistant
#            (license and platform go with repo, for the structured data)
#   bestpractices
#            the number of its project at bestpractices.dev, as in the address of
#            its badge, such as 14935: its card names the level that it holds
#            there (optional; it goes with repo)
#   asset    the file of its releases that its users install, such as
#            homedarts.zip, which the commands of the Trust page download and
#            verify (optional; it goes with repo): without it, they take the
#            SBOM that every release carries, such as repo-blueprint.spdx.json
#   group    the id of the group that shows its card. A project without one has no
#            card of its own: another card leads to it with its second button
#   icon     the icon before its name
#   name     the heading of its card, which links its website
#   short    its name in a few words, before the title of each page of its website
#            in the search of the website, such as HomeDarts (optional; the
#            name otherwise)
#   tagline  one line about it, for the table of the README and other short lists
#   summary  the text of its card
#   image    the picture on top of its card, a file in docs/ such as
#            images/projects/homedarts-for-autodarts.webp: for a project with a
#            repo, a WebP that `bash scripts/project-pictures.sh` makes from the
#            social preview of the repository (image, alt and second go with group)
#   alt      what the picture shows, for those who can't see it; describe the
#            picture again when the script brings a new one
#   start    the first button of its card: where a reader starts, such as the
#            installation, with its icon, its label and its address
#   docs     the address of its documentation, its website and the second button of
#            its card (optional); one at dennis-otto.github.io puts the sitemap of
#            the project into robots.txt and its pages into the search
#   former   the folders of the address where its website lived before, such as
#            ha-autodarts for HomeDarts for Autodarts, whose repository was
#            renamed (optional; it goes with docs in a folder of the address).
#            GitHub Pages serves this website for every path that no project
#            serves, so the build writes a page at every old address that
#            former/<folder>.txt lists, which leads to the same page in the
#            folder of docs, and the 404 page leads every other address of the
#            folder there, such as that of a picture. Its card keeps the anchor
#            of each, such as /#ha-autodarts
#   second   the slug of a project without a card, whose first button is the second
#            button of this card instead of that of the documentation (optional),
#            such as the dashboard on the card of the blueprint that builds it
#
# Every text has one entry per language, such as name.en and name.de. An address,
# such as start.url or docs, is the same in every language, or has one per language
# too; a language without an address of its own takes that of the first. Icons are
# those of Material for MkDocs, such as material-download:
# https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
# Both buttons of a card fit on one line on a phone, 375 pixels wide, as long as
# their labels are as short as these: the button to the documentation says "Docs",
# or "Doku" in German, for that reason.

# The languages of the website; the README is in the first.
languages = ["en", "de"]

# The second button of every card with documentation.
[documentation]
icon = "material-book-open-variant"
label.en = "Docs"
label.de = "Doku"

# The live facts of the home pages: the latest release and the quality numbers on
# the card of every project with a repo, and its latest release under What's new.
# docs/javascripts/projects.js writes them into the page as it loads, from the data
# that the dashboard of the blueprint publishes at the same address every few hours;
# without them, a card shows what the build put into it. The texts from released
# to bestpractices hold {} where the value goes, in the language of the page, such
# as "3 days ago", "vor 3 Tagen", 100% or 100 %.
#   label     the name of the list of the facts of a card, for screen readers
#   released  the date of the latest release
#   coverage  the share of the code that its tests run, as the dashboard reports it
#   mutation  the share of mutants of the code that its tests catch
#   scorecard the score of its repository in the OpenSSF Scorecard, of 10
#   answer    the median time to the first answer by a person to a new issue
#   bestpractices
#             the level of the OpenSSF Best Practices of a project with
#             bestpractices, which the build reads from bestpractices.dev: one of
#             passing, silver and gold, the names of the levels
# and the texts of the Releases page, docs/releases.md and docs/releases.de.md,
# where the line <!-- release-notes --> becomes the notes of the latest releases of
# every project with a repo, which the build reads from the API of GitHub:
#   projects  the name of the list of links to the heading of every project, for
#             screen readers
#   github    the link of every release to its page on GitHub
#   releases  the link below the releases of a project to all of them on GitHub,
#             with {} where its short name goes
[facts]
label.en = "Release and quality"
label.de = "Release und Qualität"
released.en = "released {}"
released.de = "veröffentlicht {}"
coverage.en = "{} test coverage"
coverage.de = "{} Testabdeckung"
mutation.en = "{} mutation score"
mutation.de = "{} Mutations-Score"
scorecard.en = "Scorecard {}"
scorecard.de = "Scorecard {}"
answer.en = "first answer by a person in {}"
answer.de = "erste Antwort eines Menschen nach {}"
bestpractices.en = "OpenSSF Best Practices: {}"
bestpractices.de = "OpenSSF Best Practices: {}"
passing.en = "passing"
passing.de = "bestanden"
silver.en = "silver"
silver.de = "Silber"
gold.en = "gold"
gold.de = "Gold"
projects.en = "Projects"
projects.de = "Projekte"
github.en = "Release on GitHub"
github.de = "Release auf GitHub"
releases.en = "All releases of {} on GitHub"
releases.de = "Alle Releases von {} auf GitHub"

# The table of the Trust page, in place of the line <!-- trust --> of docs/trust.md
# and docs/trust.de.md: a column for every project with a repo, under its short
# name, and a row for every guarantee. As the page loads, the script of the live
# facts writes the latest release and the numbers of the dashboard into the rows
# release, coverage, mutation and scorecard, as on the cards; without them, a cell
# keeps what the build put into it: a link to the releases on GitHub, or a dash. The
# build names the level of the OpenSSF Best Practices of every project, as on its
# card. The line <!-- verify --> of the page becomes the commands that check the
# latest release of every project, a tab for each.
#   caption   the caption of the table
#   guarantee the heading of the column of the guarantees
#   note      a sentence below the table, in Markdown: where its numbers come from
#   release, coverage, mutation, scorecard, bestpractices
#             the label of each row whose value differs from project to project
#   tag, provenance, immutable, sbom, vex, policy, report
#             the label and the value of each row that every project shares; the
#             value of policy links the SECURITY.md of each project, and that of
#             report the form for its private reports
# Every claim holds for every project with a repo, as its SECURITY.md says, which the
# blueprint writes: change a claim here only when every SECURITY.md has changed.
[trust]
caption.en = "The guarantees of every project"
caption.de = "Die Garantien jedes Projekts"
guarantee.en = "Guarantee"
guarantee.de = "Garantie"
note.en = "The latest releases and the numbers of the tests and of the Scorecard come from the [dashboard](https://dennis-otto.github.io/repo-blueprint/dashboard/) as the page loads, and follow it within two hours; a dash stands for a number that it doesn't have. The build reads the level of the OpenSSF Best Practices from [bestpractices.dev](https://www.bestpractices.dev/) every day."
note.de = "Die neuesten Releases und die Zahlen der Tests und der Scorecard kommen beim Laden der Seite aus dem [Dashboard](https://dennis-otto.github.io/repo-blueprint/dashboard/) und folgen ihm innerhalb von zwei Stunden; ein Strich steht für eine Zahl, die es nicht hat. Die Stufe der OpenSSF Best Practices liest der Build jeden Tag von [bestpractices.dev](https://www.bestpractices.dev/)."
release.en = "Latest release"
release.de = "Neuestes Release"
tag.label.en = "Signed tags"
tag.label.de = "Signierte Tags"
tag.value.en = "gitsign, without a key"
tag.value.de = "gitsign, ohne Schlüssel"
provenance.label.en = "Build provenance"
provenance.label.de = "Build-Provenienz"
provenance.value.en = "SLSA Build Level 3"
provenance.value.de = "SLSA Build Level 3"
immutable.label.en = "Immutable releases"
immutable.label.de = "Unveränderliche Releases"
