# Its workflows run on the runners of GitHub, the analysis with one of these engines.
requires.en = "GitHub Actions and Claude, Codex, Gemini or Copilot"
requires.de = "GitHub Actions und Claude, Codex, Gemini oder Copilot"
group = "maintainers"
icon = "material-robot-happy"
name.en = "Issue assistant"
name.de = "Issue assistant"
tagline.en = "A GitHub Action that looks after issues"
tagline.de = "Eine GitHub Action, die sich um Issues kümmert"
summary.en = "A GitHub Action that looks after the issues of a repository: a first analysis by an AI that only reads, labels, duplicates, reminders for open questions, and the way from the fix to the release."
summary.de = "Eine GitHub Action, die sich um die Issues eines Repositorys kümmert: eine erste Analyse durch eine KI, die nur liest, Labels, Duplikate, Erinnerungen an offene Fragen und der Weg vom Fix bis zum Release."
image.en = "images/projects/issue-assistant.webp"
image.de = "images/projects/de/issue-assistant.webp"
alt.en = "The social preview of the Issue assistant: its icon, its name and what it does, a GitHub Action that looks after the issues of a repository, beside a picture of the project."
alt.de = "Logo, Name und Kurzbeschreibung des Issue assistant, eine GitHub Action, die sich um die Issues eines Repositorys kümmert, neben einem Bildschirmfoto des Projekts."
# GitHub and its comments speak English, so its German picture shows them in English.
drawing.screenshot = "docs/images/hero-still-dark.webp"
drawing.logo = "docs/assets/logo.svg"
drawing.accent = "#a78bfa"
start.icon = "material-github"
start.label.en = "Use the action"
start.label.de = "Action einsetzen"
start.url = "https://github.com/Dennis-Otto/issue-assistant#set-up-a-repository"
docs = "https://dennis-otto.github.io/issue-assistant/"

[[project]]
slug = "repo-blueprint"
repo = "Dennis-Otto/repo-blueprint"
license = "MIT-0"
platform = "Copier"
bestpractices = 15284
# The oldest Copier that copies and updates it.
requires.file = "copier.yml"
requires.field = "_min_copier_version"
requires.text.en = "Copier {} or newer"
requires.text.de = "Copier {} oder neuer"
group = "maintainers"
icon = "material-file-tree"
name.en = "Repo Blueprint"
name.de = "Repo Blueprint"
tagline.en = "The template all of these repositories are made from"
tagline.de = "Die Vorlage, aus der all diese Repositorys entstehen"
summary.en = "The Copier template all of these projects are made from: tests on every change, a release bot, security checks and the settings of the repository as code, for seven kinds of projects. A bot brings every repository up to each new release."
summary.de = "Die Copier-Vorlage, aus der all diese Projekte entstehen: Tests bei jeder Änderung, ein Release-Bot, Sicherheitsprüfungen und die Einstellungen des Repositorys als Code, für sieben Arten von Projekten. Ein Bot bringt jedes Repository auf jede neue Version."
image.en = "images/projects/repo-blueprint.webp"
image.de = "images/projects/de/repo-blueprint.webp"
alt.en = "The social preview of Repo Blueprint: its icon, its name and what it does, the template that all of these repositories are made from, beside a picture of the project."
alt.de = "Symbol, Name und Kurzbeschreibung von Repo Blueprint, die Vorlage, aus der all diese Repositorys entstehen, neben einem Bildschirmfoto des Projekts."
# GitHub speaks English, so its German picture shows it in English; it has no logo
# of its own as a file, so the picture shows the icon of its card.
drawing.screenshot = "docs/images/github-pr-coach.dark.png"
drawing.accent = "#60a5fa"
start.icon = "material-rocket-launch"
start.label.en = "Start a repository"
start.label.de = "Repository anlegen"
start.url.en = "https://github.com/Dennis-Otto/repo-blueprint#start-a-repository"
start.url.de = "https://github.com/Dennis-Otto/repo-blueprint/blob/main/README.de.md#ein-repository-anlegen"
docs.en = "https://dennis-otto.github.io/repo-blueprint/"
docs.de = "https://dennis-otto.github.io/repo-blueprint/de/"
# Its website opens from the heading of the card; the second button leads to the
# dashboard, which the blueprint builds.
second = "dashboard"

# No card of its own: the second button of the card of the blueprint leads to it.
[[project]]
slug = "dashboard"
icon = "material-view-dashboard"
name.en = "Repository dashboard"
name.de = "Repository-Dashboard"
tagline.en = "The state of every repository at a glance"
tagline.de = "Der Zustand aller Repositorys auf einen Blick"
summary.en = "The state of every repository at a glance: checks, releases, open pull requests, security findings and the version of the blueprint."
summary.de = "Der Zustand aller Repositorys auf einen Blick: Prüfungen, Releases, offene Pull Requests, Sicherheitsfunde und die Version des Blueprints."
start.icon = "material-view-dashboard"
start.label.en = "Dashboard"
start.label.de = "Dashboard"
start.url = "https://dennis-otto.github.io/repo-blueprint/dashboard/"
