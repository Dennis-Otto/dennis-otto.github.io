immutable.value.de = "ja"
sbom.label.en = "SBOM"
sbom.label.de = "SBOM"
sbom.value.en = "SPDX and CycloneDX"
sbom.value.de = "SPDX und CycloneDX"
vex.label.en = "OpenVEX"
vex.label.de = "OpenVEX"
vex.value.en = "for every accepted advisory"
vex.value.de = "für jedes akzeptierte Advisory"
coverage.en = "Test coverage"
coverage.de = "Testabdeckung"
mutation.en = "Mutation score"
mutation.de = "Mutations-Score"
scorecard.en = "OpenSSF Scorecard"
scorecard.de = "OpenSSF Scorecard"
bestpractices.en = "OpenSSF Best Practices"
