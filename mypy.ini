# The types of the Python of this website: the hooks in .github/mkdocs_project.py and
# .github/hub/, scripts/screenshots.py and the tests, which the step "The format, the
# rules and the types of the Python" of scripts/check-project.sh checks with the mypy
# of requirements-test.txt, in its strict mode, as the blueprint checks its own.
[mypy]
python_version = 3.11
strict = True
files = .github/hub, .github/mkdocs_project.py, scripts/screenshots.py, tests
# The folders that the tests and the hooks import from, as ruff.toml names them.
mypy_path = .github, tests
explicit_package_bases = True
cache_dir = .cache/mypy

# MkDocs and Material for MkDocs are tools of the website alone, in .venv-docs, which
# the tests don't need: the hooks import them only while MkDocs runs them.
[mypy-mkdocs.*,material]
ignore_missing_imports = True
