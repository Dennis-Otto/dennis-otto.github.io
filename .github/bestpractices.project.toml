# The answers of OpenSSF Best Practices (https://www.bestpractices.dev) that only this
# repository can give, on top of .bestpractices.json, which the blueprint keeps current
# with what it guarantees for every repository of its kind. Never change that file: an
# answer of this repository alone goes here, and no update of the blueprint touches it.
#
# One table for each criterion, named as in .bestpractices.json, such as [test] or
# [osps_br_07_01]. For a criterion that .bestpractices.json answers, a table gives only
# its justification, which replaces the file's own: the status stays the blueprint's
# Met. For any other criterion, such as security_review, a table gives status (Met,
# Unmet or N/A) and justification. A link names a file or a heading of this repository,
# or uses https. Only what is true of this repository belongs here, such as its own
# end-to-end tests:
#
# [test]
# justification = "pytest, and the end-to-end tests in Docker: https://github.com/OWNER/REPOSITORY/blob/main/tests/e2e/run.sh"
#
# [security_review]
# status = "Met"
# justification = "..."
#
# The weekly run of the workflow Links compares the public entry with both files and
# keeps an issue with the links of the edit pages that take the answers in: change an
# answer here, not on the site, as these links force it back. "Save (and continue)" on
# bestpractices.dev reads .bestpractices.json only. The step "Answers for
# bestpractices.dev" of scripts/check.sh checks this file with
# python3 .github/blueprint.py best-practices --verify.
# https://github.com/Dennis-Otto/repo-blueprint/blob/main/docs/features/bots.md#the-entry-on-bestpracticesdev

[coding_standards]
justification = "README.md names the coding standards of the code of this website: its Python, the hooks in .github/mkdocs_project.py and .github/hub/, scripts/screenshots.py and the tests, follows PEP 8 in the format of Ruff, with the rules that ruff.toml selects and type hints that mypy checks in its strict mode with mypy.ini, and its JavaScript, the scripts in docs/javascripts/ and overrides/partials/ and their tests, follows the format and the recommended rules of Biome, as biome.jsonc sets them up; CONTRIBUTING.md names the coding standards of the rest: ShellCheck for the shell scripts, actionlint and zizmor for the workflows, markdownlint for Markdown and .editorconfig for every text file: https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/README.md#coding-standards https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/CONTRIBUTING.md#coding-standards"

[coding_standards_enforced]
justification = "scripts/check.sh, which the required check check (generic) runs on every pull request, ends with scripts/check-project.sh, which fails on any finding of Ruff's format and rules, of mypy in its strict mode and of Biome, a warning included, and whose --fix the job of the check runs, so that the fix bot commits what Ruff and Biome can fix; scripts/check.sh runs ShellCheck as well, and the Lint workflow actionlint, markdownlint, REUSE and the DCO check, on every pull request, which merges only when they pass; a new alert of zizmor's audit of the workflows stops the merge as well, and CONTRIBUTING.md asks that an exception to a rule be rare and marked at its place in the code, with its reason in a comment: https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/scripts/check-project.sh https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/scripts/check.sh"

[documentation_current]
justification = "The documentation changes in the pull request that changes what it describes, as the checklist of the pull request template asks, and the maintainer keeps it true to the latest release, as GOVERNANCE.md says; the pages Security and privacy, About, Roadmap and Trust say at their top, to whoever edits them, to keep what they say true to the repositories and to change their German page with them; the website is built and checked on every change, and the Links workflow checks the links of the documentation whenever it changes and every week and keeps an issue open while one is broken; a defect of the documentation is fixed through an issue, as #22 was, a security page that promised what the website didn't have: https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/.github/pull_request_template.md https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/docs/security.md"

[installation_development_quick]
justification = "CONTRIBUTING.md shows how to set up everything to make and test changes: bash scripts/check.sh runs the checks, the same on a computer and in the CI, and git config core.hooksPath .githooks runs them before every push; the tools of the website go into a virtual environment .venv-docs with pip install --require-hashes -r .github/docs-requirements.txt, and with them bash scripts/check.sh builds the website as well, as its section Website says; the dev container in .devcontainer/ has every tool set up, for VS Code and GitHub Codespaces. The checks of this website alone, scripts/check-project.sh, which scripts/check.sh runs last, install their hash-pinned tools themselves, with Python 3.11 and Node 22.8 or newer: pytest, coverage, Ruff and mypy from requirements-test.txt into .cache/test-venv, and Biome from tests/lint/package-lock.json: https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/CONTRIBUTING.md#checks https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/README.md#the-checks-of-this-website"

[test_policy_mandated]
justification = "CONTRIBUTING.md has the written policy: changes need tests, and the checks of scripts/check.sh pass, whose last step, scripts/check-project.sh, runs the automated test suite in tests/ on every pull request as part of the required check check (generic): pytest under coverage.py, which fails below 100 % of the lines and branches, and Node's test runner for the scripts of the browser, which fails below 100 % of their lines, branches and functions, so new code of the hooks and of the browser scripts that no test runs fails the check; GOVERNANCE.md asks every contributor for tests for every new function and every fix, and the checklist of the pull request template asks for them: https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/CONTRIBUTING.md#requirements-for-changes https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/scripts/check-project.sh"

[updateable_reused_components]
justification = "The hooks of the website in .github/mkdocs_project.py and .github/hub/ use only the standard library of Python beside MkDocs and Material for MkDocs, which run them, scripts/screenshots.py only the standard library, and the scripts in docs/javascripts/ and overrides/partials/ only the APIs of the browser; every dependency of the build, the tests and the checks comes from its package manager, pinned in a lock file, every action by its commit hash and every image by its digest, and Renovate updates them: https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/GOVERNANCE.md#automation https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/README.md#coding-standards"
