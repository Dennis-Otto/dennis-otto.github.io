# The area labels of pull requests by the files they change, for the Area labels
# workflow; each label is an area of .github/labels.toml. The entries under one
# changed-files are alternatives: one that matches is enough.
"area: pages":
  - changed-files:
      # projects.toml is the catalog of the projects that the home page shows.
      - any-glob-to-any-file: ["docs/decisions/**", "projects.toml"]
      # An English page; its German twin belongs to the area german.
      - all-globs-to-any-file: ["docs/*.md", "!docs/*.de.md"]
"area: german":
  - changed-files:
      - any-glob-to-any-file: ["docs/**/*.de.md"]
"area: design":
  - changed-files:
      - any-glob-to-any-file: ["docs/stylesheets/**", "docs/assets/**", "overrides/**", "mkdocs.yml"]
