# The explanations of the checks of this project alone, on top of .github/checks.toml,
# which the blueprint keeps current. When one of them fails, the PR coach shows its
# explanation in the summary of the check, as its annotation and in its comment on the
# pull request, also on a pull request from a fork; scripts/check.sh shows those of its
# steps on your machine too. Explain every check that you add to the required checks
# of .github/repository.project.toml, so that the next person sees how to fix it. The
# comment follows a workflow of this project alone, such as one of visual tests, once
# the answer test_workflows of .copier-answers.yml names it.
# https://github.com/Dennis-Otto/repo-blueprint#the-pr-coach

# A check by the name that GitHub shows, where a * stands for any text. Each has a
# title, problem, why and fix, and may have commands, one per line, and docs, a link or
# a file of the repository with its anchor:
# [check."e2e (*)"]
# title = "The end-to-end tests"
# problem = """A test of the whole app in a real browser failed; the summary of the
# check names the test, and its trace shows each step."""
# why = """These tests use the app as its users do, in a real browser."""
# fix = """Run the test that failed on your machine, fix what it shows, and push."""
# commands = ["bash tests/e2e/run.sh"]
# docs = "CONTRIBUTING.md#checks"

# A step of scripts/check.sh by the name that it prints, such as the step that runs
# scripts/check-project.sh, to explain the checks of this project there:
# [step."Checks of this project"]
# problem = """..."""
# why = """..."""
# fix = """..."""

# ---------------------------------------------------------------- the checks

# The check docs, in place of the explanation of the blueprint, whose parts it repeats:
# after the strict build, lychee, blueprint.py site-check and scripts/check-site.sh, with
# the two parts of this website, each under the heading that it prints after ==: what
# the hooks of .github/mkdocs_project.py promise in the files of the website, and the
# hub in a browser, tests/e2e/hub.mjs, with each of its scenarios by its title.
# tests/test_checks_project.py fails when a heading or a title is missing here.
[check.docs]
title = "The website"
problem = """The website doesn't build strictly, or a check of the built website failed.
The build fails when a link or an anchor leads nowhere, a page is missing from the
navigation of `mkdocs.yml`, or MkDocs warns about a page. After the build, lychee checks
every link and anchor of the built pages, `blueprint.py site-check` what the hooks of
every website promise, such as a sitemap in every folder of pages, and that no page
loads more than 1,200 KB at once, and `scripts/check-site.sh` this website in two
parts, each under its heading after `==` in the log. *What the hooks of this website
promise in its files*: a file that `.github/mkdocs_project.py` writes after the build,
such as `robots.txt`, a page at an old address, a card of a home page or the search of
every project, breaks a promise, and its line names the file and the fix. *The hub in a
browser*: a scenario of `tests/e2e/hub.mjs` failed in Chrome, at the width of a phone
or of a desktop, by its title: *The search finds a project website*, *The old addresses
lead to the new folder*, *The 404 page suggests a project*, *The live facts fill the
cards and the Trust table* or *The language switch leads to the German home page*. Its
line says what broke and which file does it, and on a pull request the artifact
*website* of the run keeps a screenshot and a trace of each failure in `.e2e/`. When
the log names a font or a script that Material couldn't download, its server had a
hiccup, which usually passes when the job runs again."""
why = """A strict build keeps every link of the documentation working, and the checks
of the built website see what the build doesn't, such as what a new version of
Material or of its plugins changes in the pages. The search across every project, the
old addresses and the live facts work only together with the JavaScript of Material in
a browser, while the tests of the scripts and of the hooks run each part alone, so only
the browser tests see that an update broke the hub for its readers."""
fix = """Fix what the log names. A broken promise of the hooks has the file and the fix
on its line. A failed scenario names the file that does what broke; its trace, which
https://trace.playwright.dev opens in the browser without sending it anywhere, shows
each step with the page as it looked. Build the website and check it as the check
does, with the tools of the section Website of CONTRIBUTING.md, Node 20 or newer and
Google Chrome, or another Chrome or Chromium that CHROME names by its path:"""
commands = [
  ".venv-docs/bin/mkdocs build --strict",
  "python3 .github/blueprint.py site-check site",
  "bash scripts/check-site.sh site",
]
docs = "README.md#the-hub-in-a-browser"
autofix = """A link that leads nowhere, a broken promise of the hooks or a scenario
that fails in the browser needs a person, who knows what the page should do."""

# ---------------------------------------------------------------- the steps

# scripts/check-project.sh, which scripts/check.sh runs last: the three checks of this
# website, each under the heading that it prints after ==. The tables of the projects in
# README.md and README.de.md come from projects.toml, so the fix bot writes them anew;
# the tests need a person. tests/test_checks_project.py fails when a heading of the script is missing
# here, or the autofix is no longer the command that writes the table.
[step."Checks of this project"]
problem = """One of the three checks of this website in `scripts/check-project.sh`
failed, the one under the last heading after `==` in its output. *Tests of the scripts
of the website, with every line, branch and function covered*: a test of a script that
the website runs in the browser failed, or the tests leave a line, a branch or a
function of `docs/javascripts/` or `overrides/partials/` out, which the table of the
coverage names. *The projects of projects.toml in the READMEs*: the table of the
projects in `README.md` or in `README.de.md` differs from `projects.toml`, as the diff
shows, or `projects.toml` lacks a text, such as a German one. *Tests of the hooks of the website, with every line
and branch covered*: a test of `.github/mkdocs_project.py` failed, or the tests leave a
line or a branch of it out, which the report of the coverage names."""
why = """The scripts run in the browser of every visitor, and the hooks build every page
of the website from `projects.toml`. The tables hold every address of `projects.toml`,
the German ones too, so that the link check, which reads the Markdown files, checks the
buttons of the cards as well."""
fix = """A table that differs: on a branch of this repository the fix bot commits it,
written from `projects.toml`. On a pull request from a fork the bot can only suggest
lines that the pull request already changes, so run the first command there and push.
A text that `projects.toml` lacks, a test
that fails or a line that no test runs needs you: add the text, fix the code or its
test, or test the line that the report names. Then run the checks again, with `py -3`
in place of `python3` on Windows:"""
commands = [
  "python3 -I .github/mkdocs_project.py --write",
  "bash scripts/check-project.sh",
]
docs = "README.md#the-checks-of-this-website"
autofix = ["{python} -I .github/mkdocs_project.py --write"]
