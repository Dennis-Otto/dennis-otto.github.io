name: Idea for the website
description: A page, a section or an improvement of dennis-otto.github.io.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Within a few minutes, the issue assistant posts a first analysis; the maintainer reads every issue as well ([what happens with your issue](https://github.com/Dennis-Otto/dennis-otto.github.io/blob/main/SUPPORT.md#what-happens-with-your-issue)).

        **An idea for one of the projects** belongs to the issues of its own repository: [HomeDarts for Autodarts](https://github.com/Dennis-Otto/homedarts-for-autodarts/issues/new/choose), [Paperless Sync](https://github.com/Dennis-Otto/paperless-sync/issues/new/choose), [Paperless Unified Search](https://github.com/Dennis-Otto/paperless-unified-search/issues/new/choose), [Issue assistant](https://github.com/Dennis-Otto/issue-assistant/issues/new/choose) or [Repo Blueprint](https://github.com/Dennis-Otto/repo-blueprint/issues/new/choose), which also builds the repository dashboard. That includes an idea for the documentation of a project, the pages under `dennis-otto.github.io/<project>/`.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation and what is missing today, not only the solution.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home page
        - Trust, About, security page or decision records
        - German pages
        - Design, dark mode or layout on phones
        - Other
  - type: textarea
    id: proposal
    attributes:
      label: What do you suggest?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and the website.
          required: true
