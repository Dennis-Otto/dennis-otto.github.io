name: Catalog

# The catalog bot of this website. Every week it compares projects.toml, the list
# of the projects on the home page, with the repositories of the owner on GitHub
# and with the websites of the projects in every language: a public repository
# with a website at dennis-otto.github.io that the catalog lacks, a repository of
# the catalog that was renamed, archived, made private or deleted, a German
# website that appeared or is gone, and a file from which a card reads what its
# project works with that is gone from the default branch of its repository or
# lacks its version; it reads each such file from raw.githubusercontent.com. It keeps one issue with what differs open until
# the catalog is current, and closes it then. The comparison is that of
#   python3 -I .github/mkdocs_project.py --network <the list of gh repo list> --fix <file>
# with the standard library alone.
#
# A difference with one correct edit needs no person: a German website that appeared
# or is gone, or a website whose folder its repository names anew. The comparison makes
# the edit in its copy of the repository, without secrets, and writes that issue. Only
# the job catalog-pull-request has the release app, and runs nothing that the
# comparison made: it keeps one pull request from the branch bot/catalog with the
# edits, so that their checks run, for a person to merge, closes it when main needs no
# edit any more, leaves one with a commit of a person alone, and names it in the
# issue. Without the release app, the issue still says each edit.
#
# Every day it also starts the Docs workflow on main, which builds and publishes the
# website again: its search takes the pages of the project websites from their
# search indexes while it is built, so it follows their documentation within a day,
# and security.txt expires a year after the build.
#
# And every day, after that build, it watches what the published website depends on
# and nothing else checks after the build: the data of the dashboard of the
# blueprint, against the schema and the fields that docs/javascripts/projects.js
# reads, which .github/dashboard-fields.json names; the search index of every
# project website, which the next build takes into the search; both copies of
# security.txt, which must hold for 330 days more, robots.txt with every sitemap and
# the sitemap of this website; and every old address of former/, which must lead to
# its page in the new folder, which must answer. It keeps one issue with what needs
# attention open until nothing does, and closes it then, with
#   python3 -I .github/mkdocs_project.py --watch
# This workflow belongs to this repository, not to the blueprint.

on:
  schedule:
    # The comparison, every Monday.
    - cron: "23 5 * * 1"
    # The new build of the website, every day.
    - cron: "41 4 * * *"
    # The watch of the live websites, every day after that build.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "compare the catalog, build the website again, or watch the live websites"
        type: choice
        options:
          - catalog
          - rebuild
          - watch
        default: catalog

permissions: {}

# One group per job, whatever started it: a comparison started by hand waits for
# the one of Monday, and a watch started by hand for the daily one, so that none
# opens the same issue twice.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.schedule == '17 6 * * *' || inputs.job == 'watch') && 'watch' || (github.event.schedule == '41 4 * * *' || inputs.job == 'rebuild') && 'rebuild' || 'catalog' }}
  cancel-in-progress: false

jobs:
  catalog:
    name: catalog
    if: github.event.schedule == '23 5 * * 1' || inputs.job == 'catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # to open, update and close the one issue of the bot
    outputs:
      edits: ${{ steps.keep.outputs.edits }}
      issue: ${{ steps.issue.outputs.number }}
    steps:
      # The job holds a token that writes issues, so it reaches only the hosts of
      # its steps: gh asks api.github.com, the checkout fetches from github.com,
      # the comparison asks the websites of the projects at dennis-otto.github.io
      # for their status and reads the files from which the cards read what their
      # projects work with from raw.githubusercontent.com, and the edits go to the
      # store of the artifacts through results-receiver. Without sudo and Docker,
      # no step can lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            dennis-otto.github.io:443
            raw.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo-and-containers: true
      # Harden-Runner points the DNS of the runner to itself while the runner still
      # resolves hosts of GitHub. An answer that passed it by stays in the cache of
      # systemd-resolved for up to a minute, and every connection to its address is
      # blocked (#88; homedarts-for-autodarts#488). Without sudo and Docker,
      # Harden-Runner also removes Docker with apt-get in the background, which a
      # job that ends first leaves behind, hanging in "Cleaning up orphan
      # processes" until its timeout. So the job waits for both, at most two
      # minutes each, before its first step that needs the network, and says so
      # for every try that is still blocked.
      - name: Wait until Harden-Runner has removed Docker and lets the hosts through
        run: |
          start=$SECONDS
          while pgrep -x 'apt-get|dpkg' >/dev/null && ((SECONDS - start < 120)); do
            sleep 1
          done
          echo "Harden-Runner was done with apt-get after $((SECONDS - start)) s."
          deadline=$((SECONDS + 120))
          for host in api.github.com github.com dennis-otto.github.io raw.githubusercontent.com results-receiver.actions.githubusercontent.com; do
            try=1
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if ((SECONDS >= deadline)); then
                echo "::error::Harden-Runner still blocks $host after two minutes; start the job again."
                exit 1
              fi
              echo "::notice::Harden-Runner still blocks $host (try $try), waiting 3 s."
              try=$((try + 1))
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the repositories of the owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORIES: ${{ runner.temp }}/repositories.json
        # The fields are those of FIELDS in .github/mkdocs_project.py. The token of
        # the workflow sees the public repositories alone.
        run: |
          gh repo list "$OWNER" --limit 1000 \
            --json nameWithOwner,homepageUrl,isArchived,isPrivate >"$REPOSITORIES"
      - name: Compare the catalog with GitHub and the websites of the projects
        id: compare
        env:
          REPOSITORIES: ${{ runner.temp }}/repositories.json
          REPORT: ${{ runner.temp }}/catalog.md
          PULL_REQUEST: ${{ runner.temp }}/pull-request.md
        # Exit 0: the catalog is current; 3 (DIFFERS): the text of the issue is in
        # REPORT, and the text of the pull request in PULL_REQUEST if there are edits;
        # anything else, such as the 1 of a Python that stops with an exception: the
        # bot can't tell, and the run fails without touching the issue.
        run: |
          code=0
          python3 -I .github/mkdocs_project.py --network "$REPOSITORIES" --fix "$PULL_REQUEST" >"$REPORT" || code=$?
          cat "$REPORT" >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "current=true" >>"$GITHUB_OUTPUT" ;;
            3)
              if [[ ! -s "$REPORT" ]]; then
                echo "::error::The catalog bot found differences but wrote no issue."
                exit 1
              fi
              echo "current=false" >>"$GITHUB_OUTPUT"
              ;;
            *) exit "$code" ;;
          esac
      - name: Keep the issue of the catalog current
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ steps.compare.outputs.current }}
          REPORT: ${{ runner.temp }}/catalog.md
        run: |
          title="The project catalog is out of date"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ "$CURRENT" == true ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "The catalog bot finds projects.toml current again."
            fi
            exit 0
          fi
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file "$REPORT"
          else
            created="$(gh issue create --title "$title" --label maintenance --body-file "$REPORT")"
            number="${created##*/}"
          fi
          echo "number=$number" >>"$GITHUB_OUTPUT"
      # The comparison made the edits in this copy of the repository, which nothing
      # commits; the job catalog-pull-request takes them from here, with the texts of
      # its pull request and of the issue, and without a tool of this job.
      - name: Keep the edits for the pull request
        id: keep
        env:
          EDITS: ${{ runner.temp }}/edits
          PULL_REQUEST: ${{ runner.temp }}/pull-request.md
          REPORT: ${{ runner.temp }}/catalog.md
        run: |
          if [[ ! -s "$PULL_REQUEST" ]]; then
            exit 0
          fi
          mkdir -p "$EDITS/files"
          git diff --name-only >"$EDITS/files.txt"
          xargs cp --parents --target-directory="$EDITS/files" <"$EDITS/files.txt"
          cp "$PULL_REQUEST" "$REPORT" "$EDITS/"
          echo "edits=true" >>"$GITHUB_OUTPUT"
      - name: Upload the edits for the pull request
        if: steps.keep.outputs.edits == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-edits
          path: ${{ runner.temp }}/edits/
          if-no-files-found: error
          retention-days: 3

  catalog-pull-request:
    name: catalog pull request
    needs: catalog
    # After a comparison of main that passed, to open, update or close the pull
    # request. Only main may use the environment.
    if: vars.RELEASE_AUTOMATION_CLIENT_ID != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the private key of the release app.
    environment:
      name: release
      deployment: false
    permissions:
      issues: write # to name the pull request in the one issue of the bot
    env:
      # The GitHub CLI of the job sends no telemetry to GitHub.
      GH_TELEMETRY: "false"
      # The branch of the pull request, and the first line of its commit and its title.
      BRANCH: bot/catalog
      HEADLINE: "docs: bring the project catalog up to date"
    steps:
      # The job holds a token of the release app, so it reaches only the hosts of its
      # steps: gh and the action of the token ask api.github.com, and the edits come
      # from the store of the artifacts through results-receiver. It checks out
      # nothing. Without sudo and Docker, no step can lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
          disable-sudo-and-containers: true
      # Harden-Runner points the DNS of the runner to itself while the runner still
      # resolves hosts of GitHub. An answer that passed it by stays in the cache of
      # systemd-resolved for up to a minute, and every connection to its address is
      # blocked (#88; homedarts-for-autodarts#488). Without sudo and Docker,
      # Harden-Runner also removes Docker with apt-get in the background, which a
      # job that ends first leaves behind, hanging in "Cleaning up orphan
      # processes" until its timeout. So the job waits for both, at most two
      # minutes each, before its first step that needs the network, and says so
      # for every try that is still blocked.
      - name: Wait until Harden-Runner has removed Docker and lets the hosts through
        run: |
          start=$SECONDS
          while pgrep -x 'apt-get|dpkg' >/dev/null && ((SECONDS - start < 120)); do
            sleep 1
          done
          echo "Harden-Runner was done with apt-get after $((SECONDS - start)) s."
          deadline=$((SECONDS + 120))
          for host in api.github.com results-receiver.actions.githubusercontent.com; do
            try=1
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if ((SECONDS >= deadline)); then
                echo "::error::Harden-Runner still blocks $host after two minutes; start the job again."
                exit 1
              fi
              echo "::notice::Harden-Runner still blocks $host (try $try), waiting 3 s."
              try=$((try + 1))
              sleep 3
            done
          done
      - name: Fetch the edits that the job catalog kept
        if: needs.catalog.outputs.edits == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-edits
          path: ${{ runner.temp }}/edits
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the catalog bot
          TASK: open the pull request with the edits of the catalog
          WITHOUT: the issue of the catalog says each edit
          REQUIRED: "false"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py checklist\` shows the steps: a link that registers the app with its permissions filled in, the update of the answers of the blueprint that names it in \`.github/repository.toml\`, the settings and its private key. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the branch and the pull request need, workflows included: the
          # branch of an open pull request moves from a commit on an older main to one
          # on the newest, and GitHub refuses that move without workflows when main
          # changed a workflow in between. The commit itself holds only the files that
          # the step below lets through.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open, update or close the pull request of the catalog
        id: pull-request
        if: steps.app.outputs.token != ''
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          EDITS: ${{ needs.catalog.outputs.edits }}
          ISSUE: ${{ needs.catalog.outputs.issue }}
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only the app's own pull request from the branch of this repository: a fork
          # may open one from a branch of the same name.
          open="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository,author \
            --jq "map(select(.isCrossRepository == false and .author.login == \"app/$APP_SLUG\"))[0].number // empty")"
          # A person may finish the edits on the branch, such as a website that moved,
          # which the bot would overwrite, or delete with the branch.
          others=0
          if [[ -n "$open" ]]; then
            others="$(gh pr view "$open" --json commits \
              --jq "[.commits[].authors[].login | select(. != \"${APP_SLUG}[bot]\")] | length")"
          fi
          if ((others > 0)); then
            echo "number=$open" >>"$GITHUB_OUTPUT"
            echo "#$open has a commit of a person, so the bot leaves it as it is." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EDITS" != true ]]; then
            if [[ -n "$open" ]]; then
              gh pr close "$open" --delete-branch \
                --comment "\`main\` needs none of these edits any more: $URL"
              echo "main needs no edit; closed #$open." >>"$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # Only the files that the edits touch, by plain paths, whatever the job
          # catalog kept: never a workflow.
          kept="$RUNNER_TEMP/edits"
          edited='projects\.toml|README(\.de)?\.md|docs/[^/]+\.md|tests/fixtures/not-found-data\.json'
          if grep --invert-match --line-regexp --extended-regexp "$edited" "$kept/files.txt"; then
            echo "::error::The edits of the catalog bot hold the files above, which it never edits."
            exit 1
          fi

          # Points the branch of the pull request at a commit, new or moved.
          point() {
            if gh api "repos/$GH_REPO/git/ref/heads/$1" > /dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$1" -f sha="$2" -F force=true > /dev/null
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$1" -f sha="$2" > /dev/null
            fi
          }
          # The commit starts from the commit that was compared, so that there is one
          # pull request with one commit, however often main changed. It is made on a
          # branch of its own, and the branch of the pull request moves to it in one
          # step: a pull request whose head is a commit of main would be closed by
          # GitHub. That branch starts anew, so that one which a failed run left behind
          # can't stop the next run.
          scratch="$BRANCH-next"
          if gh api "repos/$GH_REPO/git/ref/heads/$scratch" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$scratch" -f sha="$SHA" > /dev/null
          # The commit goes through GitHub's API as the release app: GitHub signs it, as
          # main requires, and it starts the checks. The sign-off names the app's
          # account, which is the author of the commit.
          user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          body="Made by the catalog bot on $SHA: $URL

          Signed-off-by: ${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          while IFS= read -r path; do
            base64 --wrap=0 "$kept/files/$path" >"$RUNNER_TEMP/contents.txt"
            jq --null-input --arg path "$path" --rawfile contents "$RUNNER_TEMP/contents.txt" \
              '{path: $path, contents: $contents}'
          done <"$kept/files.txt" >"$RUNNER_TEMP/additions.json"
          jq --null-input --arg repository "$GH_REPO" --arg branch "$scratch" --arg head "$SHA" \
            --arg headline "$HEADLINE" --arg body "$body" --slurpfile additions "$RUNNER_TEMP/additions.json" \
            '{
              query: "mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline, body: $body},
                fileChanges: {additions: $additions}
              }}
            }' >"$RUNNER_TEMP/commit.json"
          commit="$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)"
          point "$BRANCH" "$commit"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          {
            cat "$kept/pull-request.md"
            echo
            echo "The issue #$ISSUE lists every difference, those that need a person too. This run made the commit: $URL"
          } >"$RUNNER_TEMP/body.md"
          if [[ -n "$open" ]]; then
            gh pr edit "$open" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md"
          else
            created="$(gh pr create --base main --head "$BRANCH" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md")"
            open="${created##*/}"
          fi
          echo "number=$open" >>"$GITHUB_OUTPUT"
          echo "The pull request of the catalog, #$open from $BRANCH, has the commit $commit." >>"$GITHUB_STEP_SUMMARY"
      # With the token of the workflow: the release app needs no right on issues.
      - name: Name the pull request in the issue of the catalog
        if: steps.pull-request.outputs.number != '' && needs.catalog.outputs.edits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.catalog.outputs.issue }}
          NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          {
            echo "Pull request #$NUMBER makes the edits that this list marks: look at it, and merge it."
            echo
            cat "$RUNNER_TEMP/edits/catalog.md"
          } >"$RUNNER_TEMP/issue.md"
          gh issue edit "$ISSUE" --body-file "$RUNNER_TEMP/issue.md"

  rebuild:
    name: rebuild
    if: github.event.schedule == '41 4 * * *' || inputs.job == 'rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # to start the Docs workflow
    steps:
      # The job holds a token that starts workflows, so it reaches only the host
      # that gh asks, api.github.com, and runs without sudo and Docker, as the job
      # catalog does. It checks out nothing.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
          disable-sudo-and-containers: true
      # Harden-Runner points the DNS of the runner to itself while the runner still
      # resolves hosts of GitHub. An answer that passed it by stays in the cache of
      # systemd-resolved for up to a minute, and every connection to its address is
      # blocked (#88; homedarts-for-autodarts#488). Without sudo and Docker,
      # Harden-Runner also removes Docker with apt-get in the background, which a
      # job that ends first leaves behind, hanging in "Cleaning up orphan
      # processes" until its timeout. So the job waits for both, at most two
      # minutes each, before its first step that needs the network, and says so
      # for every try that is still blocked.
      - name: Wait until Harden-Runner has removed Docker and lets the hosts through
        run: |
          start=$SECONDS
          while pgrep -x 'apt-get|dpkg' >/dev/null && ((SECONDS - start < 120)); do
            sleep 1
          done
          echo "Harden-Runner was done with apt-get after $((SECONDS - start)) s."
          deadline=$((SECONDS + 120))
          for host in api.github.com; do
            try=1
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if ((SECONDS >= deadline)); then
                echo "::error::Harden-Runner still blocks $host after two minutes; start the job again."
                exit 1
              fi
              echo "::notice::Harden-Runner still blocks $host (try $try), waiting 3 s."
              try=$((try + 1))
              sleep 3
            done
          done
      # The token of a workflow may start another workflow with workflow_dispatch,
      # though not with a push; the Docs workflow publishes every run on main.
      - name: Build and publish the website again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  watch:
    name: watch
    if: github.event.schedule == '17 6 * * *' || inputs.job == 'watch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # to open, update and close the one issue of the watch
    steps:
      # The job holds a token that writes issues, so it reaches only the hosts of
      # its steps: gh asks api.github.com, the checkout fetches from github.com, and
      # the watch reads the live websites at dennis-otto.github.io, the data of the
      # dashboard among them. Without sudo and Docker, no step can lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            dennis-otto.github.io:443
          disable-sudo-and-containers: true
      # Harden-Runner points the DNS of the runner to itself while the runner still
      # resolves hosts of GitHub. An answer that passed it by stays in the cache of
      # systemd-resolved for up to a minute, and every connection to its address is
      # blocked (#88; homedarts-for-autodarts#488). Without sudo and Docker,
      # Harden-Runner also removes Docker with apt-get in the background, which a
      # job that ends first leaves behind, hanging in "Cleaning up orphan
      # processes" until its timeout. So the job waits for both, at most two
      # minutes each, before its first step that needs the network, and says so
      # for every try that is still blocked.
      - name: Wait until Harden-Runner has removed Docker and lets the hosts through
        run: |
          start=$SECONDS
          while pgrep -x 'apt-get|dpkg' >/dev/null && ((SECONDS - start < 120)); do
            sleep 1
          done
          echo "Harden-Runner was done with apt-get after $((SECONDS - start)) s."
          deadline=$((SECONDS + 120))
          for host in api.github.com github.com dennis-otto.github.io; do
            try=1
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if ((SECONDS >= deadline)); then
                echo "::error::Harden-Runner still blocks $host after two minutes; start the job again."
                exit 1
              fi
              echo "::notice::Harden-Runner still blocks $host (try $try), waiting 3 s."
              try=$((try + 1))
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Watch what the live websites hold
        id: watch
        env:
          REPORT: ${{ runner.temp }}/watch.md
        # Exit 0: nothing needs attention; 3 (DIFFERS): the text of the issue is in
        # REPORT; anything else, such as the 2 of a website that can't be reached
        # twice or the 1 of a Python that stops with an exception: the watch can't
        # tell, and the run fails without touching the issue.
        run: |
          code=0
          python3 -I .github/mkdocs_project.py --watch >"$REPORT" || code=$?
          cat "$REPORT" >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "current=true" >>"$GITHUB_OUTPUT" ;;
            3)
              if [[ ! -s "$REPORT" ]]; then
                echo "::error::The watch found something that needs attention but wrote no issue."
                exit 1
              fi
              echo "current=false" >>"$GITHUB_OUTPUT"
              ;;
            *) exit "$code" ;;
          esac
      - name: Keep the issue of the watch current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ steps.watch.outputs.current }}
          REPORT: ${{ runner.temp }}/watch.md
        run: |
          title="The live websites need attention"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ "$CURRENT" == true ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "The watch finds everything that the website depends on live again."
            fi
            exit 0
          fi
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file "$REPORT"
          else
            gh issue create --title "$title" --label maintenance --body-file "$REPORT"
          fi
