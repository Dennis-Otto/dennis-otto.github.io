<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dennis Otto: social preview</title>
<!-- scripts/social-preview.sh renders this page into the 1280×640 image that GitHub
     shows for links to the repository: the monogram of docs/assets/logo.svg, the
     name and the tagline beside a collage of the pictures of the five projects,
     which scripts/project-pictures.sh makes from their own social previews. Render
     it again after new pictures. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=block">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body {
  --accent: #5eead4;
  position: relative;
  font-family: "Inter", "Liberation Sans", "FreeSans", sans-serif;
  color: #f8fafc;
  background:
    radial-gradient(720px 560px at 80% 50%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 72%),
    linear-gradient(135deg, #0a0f1d 0%, #0c1424 55%, #0b1a24 100%);
}
.left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
.logo { width: 96px; height: 96px; margin-bottom: 36px; display: block; }
h1 { font-size: 64px; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em; }
.text { margin-top: 24px; font-size: 27px; line-height: 1.42; color: #cbd5e1; }
.name { white-space: nowrap; }
.address { margin-top: 32px; font-family: "JetBrains Mono", "Liberation Mono", monospace; font-size: 22px; font-weight: 600; color: var(--accent); }
/* Two columns of pictures, the second half a picture lower, turned a little to the
   reader. */
.collage { position: absolute; left: 600px; top: 50%; width: 620px; display: flex; gap: 20px; align-items: center;
  transform: translateY(-50%) perspective(1800px) rotateY(-12deg) rotateX(3deg); transform-origin: left center; }
.column { display: flex; flex-direction: column; gap: 20px; }
.collage img { display: block; width: 300px; height: 150px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 40px color-mix(in srgb, var(--accent) 10%, transparent); }
</style>
</head>
<body>
<div class="left">
  <img class="logo" src="../docs/assets/logo.svg" alt="">
  <h1>Dennis Otto</h1>
  <p class="text">Open-source apps for <span class="name">Home Assistant</span>, Nextcloud and <span class="name">Paperless-ngx</span>, and the tools that look after them on GitHub.</p>
  <p class="address">dennis-otto.github.io</p>
</div>
<div class="collage">
  <div class="column">
    <img src="../docs/images/projects/ha-autodarts.webp" alt="">
    <img src="../docs/images/projects/paperless-sync.webp" alt="">
    <img src="../docs/images/projects/paperless-unified-search.webp" alt="">
  </div>
  <div class="column">
    <img src="../docs/images/projects/issue-assistant.webp" alt="">
    <img src="../docs/images/projects/repo-blueprint.webp" alt="">
  </div>
</div>
</body>
</html>
