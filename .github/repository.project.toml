# The settings of this repository on top of .github/repository.toml, which the
# blueprint keeps current. blueprint.py and the settings bot add them: tables merge,
# lists gain their new items, and values replace those of repository.toml.
# https://github.com/Dennis-Otto/repo-blueprint#settings-as-code

# Topics that tell people searching GitHub what the website is, beside those of
# repository.toml. Not hacs: that would list a website among the integrations.
[repository]
topics = ["mkdocs-material", "personal-website", "developer-portfolio", "self-hosted", "open-source"]

# Checks that only this project runs, such as its end-to-end tests:
# [branch]
# required_checks = ["e2e"]

# An environment of this project and the secrets it needs:
# [environments.deploy]
# secrets = ["DEPLOY_TOKEN"]

# The maintainer decided on 2026-11-18 that the releases go once a day by themselves:
# the release bot merges the release pull request in its daily run once every check
# passes. A release of this repository only tags the website, with its notes, SBOMs
# and provenance: the Docs workflow publishes the website itself with every change of
# main. A release at once, for a fix that can't wait, is a start of the workflow
# Release by hand.
[variables]
RELEASE_MERGE = "daily"
